<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Management - LangGraph Multi-Agent System</title>
    <link rel="stylesheet" href="/static/management.css?v={{ version }}">
    <meta name="description" content="Manage and configure your LangGraph intelligent agents">
</head>
<body>
    <!-- Skip Link for Accessibility -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div class="management-container">
        <!-- Header Section -->
        <header class="management-header" role="banner">
            <div class="header-content">
                <div class="header-text">
                    <h1>🤖 Multi-Agent System Management</h1>
                    <p>Configure and monitor your intelligent agent ecosystem with real-time status updates and comprehensive tools management.</p>
                </div>
                <div class="header-actions">
                    <a href="/agent-form" class="btn btn-success" aria-label="Create new agent">
                        <span aria-hidden="true">➕</span> Create New Agent
                    </a>
                    <a href="/" class="btn btn-secondary" aria-label="Return to chat interface">
                        <span aria-hidden="true">💬</span> Back to Chat
                    </a>
                </div>
            </div>
        </header>

        <!-- Breadcrumb Navigation -->
        <nav class="breadcrumb" aria-label="Breadcrumb navigation">
            <a href="/" aria-label="Home">Home</a>
            <span class="breadcrumb-separator" aria-hidden="true">/</span>
            <span aria-current="page">Agent Management</span>
        </nav>

        <!-- Action Bar -->
        <div class="action-bar">
            <div class="action-group">
                <div class="search-container">
                    <input type="text" 
                           id="agent-search" 
                           class="search-input" 
                           placeholder="Search agents by name or type..."
                           aria-label="Search agents">
                    <span class="search-icon" aria-hidden="true">🔍</span>
                </div>
                <select id="filter-status" class="form-select" aria-label="Filter by status">
                    <option value="">All Status</option>
                    <option value="active">Active Only</option>
                    <option value="inactive">Inactive Only</option>
                </select>
                <select id="filter-type" class="form-select" aria-label="Filter by type">
                    <option value="">All Types</option>
                    <option value="supervisor">Supervisor</option>
                    <option value="specialized">Specialized</option>
                </select>
            </div>
            <div class="action-group">
                <button class="btn btn-primary" onclick="refreshStatus(this)" aria-label="Refresh system status">
                    <span aria-hidden="true">🔄</span> Refresh
                </button>
                <button class="btn btn-warning" onclick="reloadConfigurations(this)" aria-label="Reload agent configurations">
                    <span aria-hidden="true">⚙️</span> Reload Configs
                </button>
            </div>
        </div>

        <!-- Notification Area -->
        <div id="notification-area" role="alert" aria-live="polite" aria-atomic="true"></div>

        <!-- Main Content -->
        <main id="main-content" class="content-area" role="main">
            <!-- System Status Section -->
            <section class="status-grid" id="system-status" aria-labelledby="status-heading">
                <h2 id="status-heading" class="sr-only">System Status Overview</h2>
                <!-- Status cards will be populated here -->
                <div class="status-card">
                    <div class="loading-skeleton" style="height: 60px; margin-bottom: 8px;"></div>
                    <div class="loading-skeleton" style="height: 16px;"></div>
                </div>
                <div class="status-card">
                    <div class="loading-skeleton" style="height: 60px; margin-bottom: 8px;"></div>
                    <div class="loading-skeleton" style="height: 16px;"></div>
                </div>
                <div class="status-card">
                    <div class="loading-skeleton" style="height: 60px; margin-bottom: 8px;"></div>
                    <div class="loading-skeleton" style="height: 16px;"></div>
                </div>
                <div class="status-card">
                    <div class="loading-skeleton" style="height: 60px; margin-bottom: 8px;"></div>
                    <div class="loading-skeleton" style="height: 16px;"></div>
                </div>
            </section>

            <!-- Agents Section -->
            <section aria-labelledby="agents-heading">
                <h2 id="agents-heading" class="sr-only">Agent Configurations</h2>
                <div class="cards-grid" id="agents-grid" role="grid" aria-label="Agent cards">
                    <!-- Loading skeletons -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">
                                <div class="loading-skeleton" style="height: 24px; width: 200px; margin-bottom: 8px;"></div>
                                <div class="loading-skeleton" style="height: 16px; width: 100px;"></div>
                            </div>
                            <div class="loading-skeleton" style="height: 24px; width: 80px;"></div>
                        </div>
                        <div class="card-content">
                            <div class="loading-skeleton" style="height: 16px; margin-bottom: 8px;"></div>
                            <div class="loading-skeleton" style="height: 16px; width: 80%;"></div>
                        </div>
                        <div class="card-actions">
                            <div class="loading-skeleton" style="height: 36px; width: 60px;"></div>
                            <div class="loading-skeleton" style="height: 36px; width: 80px;"></div>
                            <div class="loading-skeleton" style="height: 36px; width: 60px;"></div>
                        </div>
                    </div>
                    <!-- More loading skeletons... -->
                    <div class="card">
                        <div class="card-header">
                            <div class="card-title">
                                <div class="loading-skeleton" style="height: 24px; width: 180px; margin-bottom: 8px;"></div>
                                <div class="loading-skeleton" style="height: 16px; width: 120px;"></div>
                            </div>
                            <div class="loading-skeleton" style="height: 24px; width: 90px;"></div>
                        </div>
                        <div class="card-content">
                            <div class="loading-skeleton" style="height: 16px; margin-bottom: 8px;"></div>
                            <div class="loading-skeleton" style="height: 16px; width: 70%;"></div>
                        </div>
                        <div class="card-actions">
                            <div class="loading-skeleton" style="height: 36px; width: 60px;"></div>
                            <div class="loading-skeleton" style="height: 36px; width: 80px;"></div>
                            <div class="loading-skeleton" style="height: 36px; width: 60px;"></div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal" role="dialog" aria-labelledby="confirm-title" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="confirm-title">Confirm Action</h2>
                <button class="modal-close" onclick="closeConfirmModal()" aria-label="Close dialog">×</button>
            </div>
            <div id="confirm-message"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" onclick="closeConfirmModal()">Cancel</button>
                <button id="confirm-action" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <script>
    // Global state
    let agents = [];
    let systemStatus = {};
    let filteredAgents = [];
    
    // Initialize page
    document.addEventListener('DOMContentLoaded', function() {
        setupEventListeners();
        loadInitialData();
    });
    
    // Setup event listeners
    function setupEventListeners() {
        // Search and filter
        document.getElementById('agent-search').addEventListener('input', debounce(filterAgents, 300));
        document.getElementById('filter-status').addEventListener('change', filterAgents);
        document.getElementById('filter-type').addEventListener('change', filterAgents);
        
        // Modal events
        document.addEventListener('keydown', handleKeyDown);
        
        // Click outside modal to close
        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeConfirmModal();
            }
        });
    }
    
    // Handle keyboard navigation
    function handleKeyDown(e) {
        if (e.key === 'Escape') {
            closeConfirmModal();
        }
    }
    
    // Debounce utility
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
    
    // Load initial data
    async function loadInitialData() {
        try {
            await Promise.all([
                loadAgents(),
                loadSystemStatus()
            ]);
        } catch (error) {
            showNotification('Failed to load initial data', 'error');
            console.error('Error loading initial data:', error);
        }
    }
    
    // Load all agents
    async function loadAgents() {
        try {
            const response = await fetch('/api/agents/');
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            agents = await response.json();
            filteredAgents = [...agents];
            renderAgents();
        } catch (error) {
            console.error('Error loading agents:', error);
            document.getElementById('agents-grid').innerHTML = `
                <div class="card">
                    <div class="card-content">
                        <div class="form-error">
                            <span aria-hidden="true">⚠️</span>
                            Failed to load agents: ${error.message}
                        </div>
                    </div>
                </div>
            `;
        }
    }
    
    // Load system status
    async function loadSystemStatus() {
        try {
            const response = await fetch('/api/agents/system/status');
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            
            systemStatus = await response.json();
            renderSystemStatus();
        } catch (error) {
            console.error('Error loading system status:', error);
            document.getElementById('system-status').innerHTML = `
                <div class="status-card">
                    <div class="form-error">
                        <span aria-hidden="true">⚠️</span>
                        Failed to load system status
                    </div>
                </div>
            `;
        }
    }
    
    // Render agents grid
    function renderAgents() {
        const grid = document.getElementById('agents-grid');
        
        if (filteredAgents.length === 0) {
            grid.innerHTML = `
                <div class="card">
                    <div class="card-content">
                        <h3>No agents found</h3>
                        <p>No agents match your current filters. Try adjusting your search criteria or create a new agent to get started.</p>
                    </div>
                    <div class="card-actions">
                        <a href="/agent-form" class="btn btn-success">Create New Agent</a>
                    </div>
                </div>
            `;
            return;
        }
        
        grid.innerHTML = filteredAgents.map(agent => `
            <div class="card" role="gridcell" tabindex="0" aria-labelledby="agent-${agent.id}-title">
                <div class="card-header">
                    <div class="card-title">
                        <h3 id="agent-${agent.id}-title">${escapeHtml(agent.name)}</h3>
                        <div class="status-indicator ${agent.is_active ? 'status-active' : 'status-inactive'}">
                            <span class="status-dot" aria-hidden="true"></span>
                            <span>${agent.is_active ? 'Active' : 'Inactive'}</span>
                        </div>
                    </div>
                    <div class="badge badge-primary">${escapeHtml(agent.agent_type)}</div>
                </div>
                
                <div class="card-content">
                    <p class="card-subtitle">${escapeHtml(agent.description)}</p>
                    
                    <div class="form-group">
                        <div class="form-label">Assigned Tools (${agent.mcp_tool_assignments?.length || 0})</div>
                        <div class="tag-list">
                            ${agent.mcp_tool_assignments?.length > 0 
                                ? agent.mcp_tool_assignments.map(tool => 
                                    `<span class="tag">${escapeHtml(tool)}</span>`
                                  ).join('')
                                : '<span class="tag">No tools assigned</span>'
                            }
                        </div>
                    </div>
                </div>
                
                <div class="card-actions">
                    <a href="/agent-form?edit=${agent.id}" 
                       class="btn btn-primary btn-sm"
                       aria-label="Edit ${escapeHtml(agent.name)} agent">
                        <span aria-hidden="true">✏️</span> Edit
                    </a>
                    <button class="btn ${agent.is_active ? 'btn-warning' : 'btn-success'} btn-sm" 
                            onclick="toggleAgent('${agent.id}', ${!agent.is_active}, '${escapeHtml(agent.name)}')"
                            aria-label="${agent.is_active ? 'Deactivate' : 'Activate'} ${escapeHtml(agent.name)} agent">
                        <span aria-hidden="true">${agent.is_active ? '⏸️' : '▶️'}</span>
                        ${agent.is_active ? 'Deactivate' : 'Activate'}
                    </button>
                    <button class="btn btn-danger btn-sm" 
                            onclick="confirmDeleteAgent('${agent.id}', '${escapeHtml(agent.name)}')"
                            aria-label="Delete ${escapeHtml(agent.name)} agent">
                        <span aria-hidden="true">🗑️</span> Delete
                    </button>
                </div>
            </div>
        `).join('');
    }
    
    // Render system status
    function renderSystemStatus() {
        const statusDiv = document.getElementById('system-status');
        const supervisor = systemStatus.supervisor || {};
        const agentData = systemStatus.agents || {};
        
        const agentCount = Object.keys(agentData).length;
        const readyCount = Object.values(agentData).filter(a => a.ready).length;
        const activeCount = agents.filter(a => a.is_active).length;
        const supervisorReady = supervisor.initialized;
        const systemHealthy = supervisorReady && readyCount === agentCount;
        
        statusDiv.innerHTML = `
            <div class="status-card">
                <h4>Supervisor Status</h4>
                <div class="status-value ${supervisorReady ? 'status-active' : 'status-inactive'}">
                    ${supervisorReady ? '✅ Ready' : '❌ Not Ready'}
                </div>
                <div class="status-trend">Core coordination system</div>
            </div>
            <div class="status-card">
                <h4>Total Agents</h4>
                <div class="status-value">${agentCount}</div>
                <div class="status-trend">${activeCount} active</div>
            </div>
            <div class="status-card">
                <h4>Ready Agents</h4>
                <div class="status-value">${readyCount}/${agentCount}</div>
                <div class="status-trend">Operational status</div>
            </div>
            <div class="status-card">
                <h4>System Health</h4>
                <div class="status-value ${systemHealthy ? 'status-active' : 'status-pending'}">
                    ${systemHealthy ? '🟢 Healthy' : '🟡 Partial'}
                </div>
                <div class="status-trend">Overall system status</div>
            </div>
        `;
    }
    
    // Filter agents
    function filterAgents() {
        const searchTerm = document.getElementById('agent-search').value.toLowerCase();
        const statusFilter = document.getElementById('filter-status').value;
        const typeFilter = document.getElementById('filter-type').value;
        
        filteredAgents = agents.filter(agent => {
            const matchesSearch = agent.name.toLowerCase().includes(searchTerm) ||
                                agent.description.toLowerCase().includes(searchTerm) ||
                                agent.agent_type.toLowerCase().includes(searchTerm);
            
            const matchesStatus = !statusFilter || 
                                (statusFilter === 'active' && agent.is_active) ||
                                (statusFilter === 'inactive' && !agent.is_active);
            
            const matchesType = !typeFilter || agent.agent_type === typeFilter;
            
            return matchesSearch && matchesStatus && matchesType;
        });
        
        renderAgents();
    }
    
    // Show notification
    function showNotification(message, type = 'success') {
        const notification = document.createElement('div');
        notification.className = `notification notification-${type}`;
        notification.textContent = message;
        
        document.body.appendChild(notification);
        
        // Trigger animation
        setTimeout(() => notification.classList.add('show'), 100);
        
        // Remove notification (longer for info messages)
        const removeDelay = type === 'info' ? 8000 : 5000;
        setTimeout(() => {
            notification.classList.remove('show');
            setTimeout(() => {
                if (document.body.contains(notification)) {
                    document.body.removeChild(notification);
                }
            }, 300);
        }, removeDelay);
    }
    
    // Refresh status
    async function refreshStatus(btn) {
        const originalText = btn.innerHTML;
        
        btn.classList.add('btn-loading');
        btn.disabled = true;
        
        try {
            await loadInitialData();
            showNotification('Status refreshed successfully!');
        } catch (error) {
            showNotification('Failed to refresh status', 'error');
        } finally {
            btn.classList.remove('btn-loading');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
    
    // Reload configurations
    async function reloadConfigurations(btn) {
        const originalText = btn.innerHTML;
        
        btn.classList.add('btn-loading');
        btn.disabled = true;
        btn.innerHTML = '<span aria-hidden="true">⏳</span> Reloading...';
        
        // Show immediate feedback for long operation
        showNotification('Reloading configurations... This may take a few seconds.', 'info');
        
        try {
            // Use longer timeout for this operation (30 seconds)
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 30000);
            
            const response = await fetch('/api/agents/system/reload', {
                method: 'POST',
                signal: controller.signal
            });
            
            clearTimeout(timeoutId);
            
            if (!response.ok) {
                const errorText = await response.text();
                let errorMessage;
                try {
                    const errorJson = JSON.parse(errorText);
                    errorMessage = errorJson.detail || errorJson.message || 'Unknown error';
                } catch {
                    errorMessage = errorText || response.statusText;
                }
                throw new Error(`HTTP ${response.status}: ${errorMessage}`);
            }
            
            const result = await response.json();
            showNotification(result.message || 'Configurations reloaded successfully!', 'success');
            await loadInitialData();
        } catch (error) {
            console.error('Error reloading configurations:', error);
            if (error.name === 'AbortError') {
                showNotification('Reload timed out after 30 seconds. Please try again.', 'error');
            } else {
                showNotification('Failed to reload configurations: ' + error.message, 'error');
            }
        } finally {
            btn.classList.remove('btn-loading');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
    
    // Toggle agent active status
    async function toggleAgent(agentId, activate, agentName) {
        const btn = event.target;
        const originalText = btn.innerHTML;
        
        btn.classList.add('btn-loading');
        btn.disabled = true;
        
        try {
            const agent = agents.find(a => a.id === agentId);
            if (!agent) {
                throw new Error('Agent not found');
            }
            
            const response = await fetch(`/api/agents/${agentId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    ...agent,
                    is_active: activate
                })
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Failed to update agent');
            }
            
            showNotification(`Agent "${agentName}" ${activate ? 'activated' : 'deactivated'} successfully!`);
            await refreshStatus();
        } catch (error) {
            console.error('Error toggling agent:', error);
            showNotification('Failed to update agent: ' + error.message, 'error');
        } finally {
            btn.classList.remove('btn-loading');
            btn.disabled = false;
            btn.innerHTML = originalText;
        }
    }
    
    // Confirm delete agent
    function confirmDeleteAgent(agentId, agentName) {
        document.getElementById('confirm-title').textContent = 'Delete Agent';
        document.getElementById('confirm-message').innerHTML = `
            <p>Are you sure you want to delete the agent <strong>"${escapeHtml(agentName)}"</strong>?</p>
            <p class="form-error">⚠️ This action cannot be undone and will permanently remove all agent configurations.</p>
        `;
        
        const confirmBtn = document.getElementById('confirm-action');
        confirmBtn.textContent = 'Delete Agent';
        confirmBtn.onclick = () => deleteAgent(agentId, agentName);
        
        showModal('confirmModal');
    }
    
    // Delete agent
    async function deleteAgent(agentId, agentName) {
        const btn = document.getElementById('confirm-action');
        const originalText = btn.textContent;
        
        btn.classList.add('btn-loading');
        btn.disabled = true;
        
        try {
            const response = await fetch(`/api/agents/${agentId}`, {
                method: 'DELETE'
            });
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Failed to delete agent');
            }
            
            const result = await response.json();
            showNotification(result.message || `Agent "${agentName}" deleted successfully!`);
            closeConfirmModal();
            
            // Remove deleted agent from local state immediately
            agents = agents.filter(agent => agent.id !== agentId);
            filteredAgents = filteredAgents.filter(agent => agent.id !== agentId);
            
            // Re-render the agents grid with updated data
            try {
                renderAgents();
            } catch (renderError) {
                console.warn('Error re-rendering agents after deletion:', renderError);
                // Fallback: reload all data if render fails
                await refreshStatus();
            }
            
            // Load system status separately to avoid errors with missing agent
            try {
                await loadSystemStatus();
            } catch (statusError) {
                console.warn('Failed to refresh system status after deletion:', statusError);
                // Don't show error to user as the deletion was successful
            }
        } catch (error) {
            console.error('Error deleting agent:', error);
            showNotification('Failed to delete agent: ' + error.message, 'error');
        } finally {
            btn.classList.remove('btn-loading');
            btn.disabled = false;
            btn.textContent = originalText;
        }
    }
    
    // Modal utilities
    function showModal(modalId) {
        const modal = document.getElementById(modalId);
        modal.classList.add('active');
        modal.setAttribute('aria-hidden', 'false');
        
        // Focus the first focusable element
        const focusable = modal.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if (focusable) focusable.focus();
    }
    
    function closeConfirmModal() {
        const modal = document.getElementById('confirmModal');
        modal.classList.remove('active');
        modal.setAttribute('aria-hidden', 'true');
    }
    
    // Utility functions
    function escapeHtml(text) {
        const map = {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#039;'
        };
        return text ? text.replace(/[&<>"']/g, m => map[m]) : '';
    }
    
    // Screen reader only class for accessibility
    const style = document.createElement('style');
    style.textContent = `
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    `;
    document.head.appendChild(style);
    </script>
</body>
</html>
